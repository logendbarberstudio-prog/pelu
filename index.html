<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Legend Barber Studio</title>
  <link rel="stylesheet" href="login.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- SDK de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="dark-mode">

  <!-- FONDO DE ESTRELLAS Y ESTRELLAS FUGACES -->
  <div class="stars"></div>
  <div class="shooting-star"></div>
  <div class="shooting-star"></div>
  <div class="shooting-star"></div>
  <div class="shooting-star"></div>

  <div class="login-container-grid">
    
    <!-- COLUMNA IZQUIERDA: LOGO CON MOVIMIENTO Y EFECTO LED -->
    <div class="logo-showcase-section">
      <div class="logo-glow-container">
        <div class="led-ring"></div>
        <div class="logo-wrapper">
          <img src="img/logo.jpg" alt="Legend Barber Studio Logo" class="animated-logo">
        </div>
      </div>
      <div class="brand-text-container">
        <h1>Legend Barber <span class="badge-gold">Studio</span></h1>
        <p>Sistema de Gestión Multi-Sucursal Profesional</p>
      </div>
    </div>

    <!-- COLUMNA DERECHA: LOGIN ORDENADO -->
    <div class="login-form-section">
      <div class="login-card">
        <div class="form-header-mobile">
          <h2>Iniciar Sesión</h2>
        </div>
        <p class="login-subtitle">Ingresa tus credenciales para acceder al panel</p>

        <!-- Mensajes de Alerta dinámicos -->
        <div id="alertMessage" class="alert hidden"></div>

        <form id="formLogin" onsubmit="procesarLogin(event)">
          <div class="form-group">
            <label for="usuario"><i class="fa-solid fa-user"></i> Usuario o Email</label>
            <div class="input-icon-wrapper">
              <input type="text" id="usuario" class="form-control" placeholder="Ej: admin" required autofocus autocomplete="username">
            </div>
          </div>

          <div class="form-group">
            <label for="password"><i class="fa-solid fa-lock"></i> Contraseña</label>
            <div class="input-icon-wrapper">
              <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
              <button type="button" class="btn-toggle-password" onclick="togglePasswordVisibility()" title="Mostrar u ocultar contraseña">
                <i class="fa-solid fa-eye" id="eyeIcon"></i>
              </button>
            </div>
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" id="recordar">
              <span>Recordarme</span>
            </label>
            <a href="#" class="forgot-pass" onclick="recuperarPassword(event)">¿Olvidaste tu contraseña?</a>
          </div>

          <button type="submit" id="btnLogin" class="btn btn-primary btn-block btn-login">
            <i class="fa-solid fa-right-to-bracket" id="btnLoginIcon"></i> 
            <span id="btnLoginText">Iniciar Sesión</span>
          </button>
        </form>

        <div class="login-footer">
          <div class="footer-content-row">
            <span>V:1.01 2026 Desarrollado JQ</span>
            <!-- Botón de WhatsApp al lado de la versión -->
            <a href="https://wa.me/593983279145?text=Hola%20Jefferson,%20necesito%20soporte%20con%20el%20sistema%20de%20gestión." 
               target="_blank" 
               rel="noopener noreferrer" 
               class="btn-whatsapp-footer" 
               title="Contactar por WhatsApp">
              <i class="fa-brands fa-whatsapp"></i> Soporte
            </a>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Botón flotante para volver arriba (útil en móviles) -->
  <button type="button" id="btnScrollTop" class="btn-scroll-top" onclick="scrollToTop()" title="Volver arriba">
    <i class="fa-solid fa-arrow-up"></i>
  </button>

  <script src="login.js"></script>
</body>
</html>
